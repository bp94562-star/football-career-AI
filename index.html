<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potrero Fútbol - Modo Carrera</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0c10] text-white font-sans max-w-md mx-auto min-h-screen flex flex-col justify-between p-3 select-none">

    <div id="pantalla-crear" class="space-y-4">
        <div class="text-center my-3">
            <span class="text-[10px] text-green-400 font-bold uppercase tracking-widest block">MODO CARRERA</span>
            <h1 class="text-2xl font-black text-white italic tracking-wider">EL ÍDOLO 🌎</h1>
        </div>

        <div class="bg-[#13151b] p-4 rounded-2xl border border-gray-800 space-y-3">
            <div>
                <label class="text-[10px] text-gray-400 font-bold uppercase block mb-1">Tu Nombre o Apodo</label>
                <input type="text" id="in-nombre" value="Brayan" class="w-full bg-[#0b0c10] border border-gray-700 rounded-xl p-2.5 text-sm font-bold text-yellow-400 focus:outline-none">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="text-[10px] text-gray-400 font-bold uppercase block mb-1">Nacionalidad</label>
                    <select id="in-nac" class="w-full bg-[#0b0c10] border border-gray-700 rounded-xl p-2.5 text-xs text-white font-bold">
                        <option value="🇲🇽 México">🇲🇽 México</option>
                        <option value="🇦🇷 Argentina">🇦🇷 Argentina</option>
                        <option value="🇪🇸 España">🇪🇸 España</option>
                        <option value="🏴󠁧󠁢󠁥󠁮󠁧󠁿 Inglaterra">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Inglaterra</option>
                        <option value="🇧🇷 Brasil">🇧🇷 Brasil</option>
                        <option value="🇨🇴 Colombia">🇨🇴 Colombia</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] text-gray-400 font-bold uppercase block mb-1">Liga de Inicio</label>
                    <select id="in-liga" onchange="cargarClubesPorLiga()" class="w-full bg-[#0b0c10] border border-gray-700 rounded-xl p-2.5 text-xs text-yellow-400 font-bold">
                        <option value="Liga MX">🇲🇽 Liga MX (México)</option>
                        <option value="LaLiga">🇪🇸 LaLiga (España)</option>
                        <option value="Premier League">🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League (Inglaterra)</option>
                        <option value="Liga Argentina">🇦🇷 Liga Argentina</option>
                        <option value="Brasileirão">🇧🇷 Brasileirão (Brasil)</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="text-[10px] text-gray-400 font-bold uppercase block mb-1">Posición</label>
                <select id="in-pos" class="w-full bg-[#0b0c10] border border-gray-700 rounded-xl p-2.5 text-xs text-white font-bold">
                    <option value="9 DELANTERO">9 DELANTERO</option>
                    <option value="10 ENGANCHE">10 ENGANCHE</option>
                    <option value="7 EXTREMO">7 EXTREMO</option>
                </select>
            </div>
        </div>

        <div class="bg-[#13151b] p-3 rounded-2xl border border-gray-800">
            <label class="text-[10px] text-gray-400 font-bold uppercase block mb-2">Ofertas Disponibles en la Liga</label>
            <div id="contenedor-clubes" class="space-y-2">
                </div>
        </div>

        <button onclick="empezarCarrera()" class="w-full bg-green-500 hover:bg-green-400 text-black font-black py-3.5 rounded-xl text-sm uppercase transition shadow-lg">
            ▶ EMPEZAR MI CARRERA
        </button>
    </div>


    <div id="pantalla-dashboard" class="hidden space-y-3">
        
        <div class="bg-[#13151b] border border-gray-800 rounded-2xl p-3 relative">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-2">
                    <div class="text-2xl font-black text-white bg-[#1a1d26] px-2.5 py-1 rounded-xl border border-gray-700" id="dash-media">57</div>
                    <div>
                        <div class="flex items-center gap-1.5">
                            <span id="dash-flag">🇲🇽</span>
                            <h2 class="font-black text-sm text-yellow-400 uppercase tracking-wide" id="dash-nombre">BRAYAN - LA 9</h2>
                        </div>
                        <div class="text-[10px] text-gray-400 font-semibold" id="dash-info">QUERÉTARO · 2026 · 16 AÑOS</div>
                    </div>
                </div>
                <img id="dash-escudo" src="" class="w-8 h-8 object-contain">
            </div>

            <div class="grid grid-cols-4 gap-1 text-center bg-[#0b0c10] p-2 rounded-xl my-2 border border-gray-800">
                <div><div class="text-green-400 font-black text-sm" id="st-goles">0</div><div class="text-[8px] text-gray-400 uppercase">Goles</div></div>
                <div><div class="text-white font-black text-sm" id="st-asist">0</div><div class="text-[8px] text-gray-400 uppercase">Asist.</div></div>
                <div><div class="text-white font-black text-sm" id="st-part">0</div><div class="text-[8px] text-gray-400 uppercase">Partidos</div></div>
                <div><div class="text-yellow-400 font-black text-sm" id="st-titulos">0</div><div class="text-[8px] text-gray-400 uppercase">Títulos</div></div>
            </div>

            <div class="grid grid-cols-6 gap-1 text-center text-[9px]">
                <div class="bg-[#1a1d26] p-1 rounded-lg"><span class="text-gray-400 block">DEF</span><strong class="text-white" id="at-def">60</strong></div>
                <div class="bg-[#1a1d26] p-1 rounded-lg"><span class="text-gray-400 block">VEL</span><strong class="text-white" id="at-vel">61</strong></div>
                <div class="bg-[#1a1d26] p-1 rounded-lg"><span class="text-gray-400 block">POT</span><strong class="text-white" id="at-pot">55</strong></div>
                <div class="bg-[#1a1d26] p-1 rounded-lg"><span class="text-gray-400 block">LID</span><strong class="text-white" id="at-lid">45</strong></div>
                <div class="bg-[#1a1d26] p-1 rounded-lg"><span class="text-gray-400 block">RES</span><strong class="text-white" id="at-res">62</strong></div>
                <button onclick="toggleTienda()" class="bg-yellow-500/20 border border-yellow-500/50 rounded-lg flex items-center justify-center text-yellow-400 font-bold text-xs">🛒</button>
            </div>

            <div class="grid grid-cols-2 gap-2 mt-2 pt-2 border-t border-gray-800 text-center">
                <div class="bg-[#0b0c10] p-1.5 rounded-xl border border-gray-800">
                    <div class="text-[8px] text-gray-400 uppercase">VALOR MERCADO</div>
                    <div class="text-xs font-mono font-bold text-green-400" id="dash-valor">US$ 700K</div>
                </div>
                <div class="bg-[#0b0c10] p-1.5 rounded-xl border border-gray-800">
                    <div class="text-[8px] text-gray-400 uppercase">DINERO GANADO</div>
                    <div class="text-xs font-mono font-bold text-yellow-400" id="dash-ganado">US$ 12K</div>
                </div>
