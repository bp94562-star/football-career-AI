<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futbol Legend World - Ultimate Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Importamos la base de datos externa -->
    <script src="database.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #050608; color: white; }
        .bg-card { background: #0e1017; }
    </style>
</head>
<body class="max-w-md mx-auto p-3 min-h-screen flex flex-col justify-between">

    <!-- HEADER / MARCA -->
    <header class="flex justify-between items-center bg-card p-3 rounded-2xl border border-gray-800">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-xl bg-green-500 flex items-center justify-center font-black text-black text-xs">⭐</div>
            <div>
                <h1 class="text-xs font-black text-green-400 uppercase">MARCA GAME ENGINE</h1>
                <p class="text-[8px] text-gray-400">WORLD CAREER V3.0</p>
            </div>
        </div>
        <button onclick="hablar('¡Bienvenido al mejor juego del mundo!')" class="bg-gray-800 p-2 rounded-xl text-xs">🗣️</button>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main id="app-container" class="space-y-3 my-3">
        <div class="bg-card p-4 rounded-2xl border border-gray-800 text-center space-y-2">
            <h2 class="text-sm font-black text-yellow-400 uppercase">🏆 SELECCIÓN DE EQUIPOS Y SELECCIONES</h2>
            <p class="text-xs text-gray-400">Explora todos los clubes, selecciones, Copa Libertadores y Mundial</p>
            <button onclick="renderizarTodoElMundo()" class="w-full bg-gradient-to-r from-green-500 to-emerald-400 text-black font-black py-3 rounded-xl text-xs uppercase shadow-lg">
                🌍 CARGAR BASE DE DATOS MUNDIAL
            </button>
        </div>
        <div id="lista-equipos" class="space-y-4"></div>
    </main>

    <script>
        // Renderizador dinámico de camisetas SVG
        function renderCamiseta(principal, secundaria, estilo) {
            let patron = "";
            if (estilo === "bastones-verticales") {
                patron = `<rect x="18" y="5" width="8" height="50" fill="${secundaria}" /><rect x="34" y="5" width="8" height="50" fill="${secundaria}" />`;
            } else if (estilo === "franja-horizontal") {
                patron = `<rect x="5" y="22" width="50" height="12" fill="${secundaria}" />`;
            } else if (estilo === "banda-diagonal") {
                patron = `<polygon points="10,5 20,5 50,50 40,50" fill="${secundaria}" />`;
            }
            return `
                <svg viewBox="0 0 60 60" width="40" height="40">
                    <path d="M 15 10 L 22 5 L 38 5 L 45 10 L 55 18 L 48 26 L 44 22 L 44 52 L 16 52 L 16 22 L 12 26 L 5 18 Z" fill="${principal}" stroke="#000" stroke-width="1.5"/>
                    ${patron}
                </svg>
            `;
        }

        // Función para recorrer la base de datos
        function renderizarTodoElMundo() {
            const container = document.getElementById("lista-equipos");
            container.innerHTML = "";

            for (let region in BASE_DATOS_MUNDIAL) {
                let htmlRegion = `<div class="bg-card p-3 rounded-2xl border border-gray-800 space-y-2"><h3 class="text-xs font-black text-green-400 uppercase">${region}</h3>`;
                let torneos = BASE_DATOS_MUNDIAL[region];

                for (let torneo in torneos) {
                    htmlRegion += `<h4 class="text-[10px] font-bold text-yellow-400 uppercase">${torneo}</h4>`;
                    torneos[torneo].forEach(eq => {
                        let kitSvg = renderCamiseta(eq.camisaLocal.principal, eq.camisaLocal.secundaria, eq.camisaLocal.estilo);
                        htmlRegion += `
                            <div class="bg-[#050608] p-2 rounded-xl flex items-center justify-between border border-gray-800/80">
                                <div class="flex items-center gap-2">
                                    <img src="${eq.escudo}" class="w-7 h-7 object-contain">
                                    <span class="text-xs font-bold text-white">${eq.nombre}</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    ${kitSvg}
                                    <button onclick="hablar('Has seleccionado a ${eq.nombre}')" class="bg-green-500 text-black font-black text-[9px] px-2 py-1 rounded-lg uppercase">
                                        Elegir
                                    </button>
                                </div>
                            </div>
                        `;
                    });
                }
                htmlRegion += `</div>`;
                container.innerHTML += htmlRegion;
            }
        }

        // Voz del personaje / narrador
        function hablar(texto) {
            if ('speechSynthesis' in window) {
                const u = new SpeechSynthesisUtterance(texto);
                u.lang = 'es-MX';
                window.speechSynthesis.speak(u);
            }
        }
    </script>
</body>
</html>
